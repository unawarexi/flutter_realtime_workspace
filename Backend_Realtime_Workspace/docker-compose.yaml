# ============================================================================
# TeamSpot — Docker Compose
# Primary dev runtime — `make dev` uses this.
#
# Project name is pinned to "teamspot" via the `name:` key so that volumes
# are ALWAYS named teamspot_* regardless of which directory docker compose
# is invoked from.  Without this, changing CWD produces a different project
# name prefix and Docker silently creates a fresh set of orphan volumes.
name: teamspot
#
# Cloud services (MongoDB Atlas, Redis Cloud, LiveKit, Qdrant) connect via
# credentials in .env — no local containers needed for them.
# Only Kafka + RabbitMQ run locally so the API can reach them on the Docker
# internal network (kafka:29092, rabbitmq:5672).
#
# Usage:
#   make dev          → docker compose up --build  (hot-reload)
#   make dev-tools    → adds Kafka UI + Mongo Express
#   make dev-local    → run API on host (nodemon), local Kafka+RabbitMQ
# ============================================================================

services:

  # ── API (Node.js — hot-reload in dev) ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development           # hot-reload stage; use 'production' for prod build
    container_name: teamspot-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env                  # loads all cloud credentials
    environment:
      # Override localhost references → Docker service hostnames
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://teamspot:teamspot0000@rabbitmq:5672
      PORT: "3000"
      HOST: 0.0.0.0
      NODE_ENV: development
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    volumes:
      - .:/app                      # mount source for hot-reload
      - /app/node_modules           # preserve container node_modules
    networks:
      - teamspot-network

  # ── Zookeeper (Kafka dependency) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: teamspot-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - teamspot-network

  # ── Kafka (Event streaming) ────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: teamspot-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"     # host access (local tools / make kafka-topics)
      - "29092:29092"   # internal Docker network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null | head -1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - teamspot-network

  # ── RabbitMQ (Task queues + AI workers) ───────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: teamspot-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI → http://localhost:15672 (teamspot/teamspot0000)
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: teamspot
      RABBITMQ_DEFAULT_PASS: teamspot0000
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - teamspot-network

  # ── Kafka UI — http://localhost:8080 ──────────────────────────────────────
  # Connects via internal Docker network (kafka:29092) — always starts with dev
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: teamspot-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: teamspot-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - teamspot-network

  # ── Mongo Express — http://localhost:8081 (dev-tools profile) ─────────────
  # Browses MongoDB Atlas data locally.  Start with: make dev-tools
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: teamspot-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "${MONGO_URI}"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_SITE_BASEURL: "/"
    networks:
      - teamspot-network
    profiles:
      - dev-tools

# ── Volumes ───────────────────────────────────────────────────────────────────
# Explicit names make volumes fully independent of project-name derivation.
volumes:
  zookeeper_data:
    name: teamspot-zookeeper-data
  zookeeper_log:
    name: teamspot-zookeeper-log
  kafka_data:
    name: teamspot-kafka-data
  rabbitmq_data:
    name: teamspot-rabbitmq-data

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  teamspot-network:
    driver: bridge
