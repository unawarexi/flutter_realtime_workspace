# ============================================================================
# TeamSpot — Kubernetes ConfigMap
# Non-sensitive configuration values
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teamspot-api-config
  namespace: teamspot
  labels:
    app: teamspot-api
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"

  # API
  API_VERSION: "v1"

  # Rate limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "300"
  AUTH_RATE_LIMIT_MAX: "20"
  AI_CHAT_RATE_LIMIT_MAX: "30"
  UPLOAD_RATE_LIMIT_MAX: "20"
  MESSAGE_RATE_LIMIT_MAX: "120"

  # Pagination
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"

  # File uploads
  MAX_FILE_SIZE_MB: "100"
  MAX_UPLOAD_SIZE_MB: "50"
  ALLOWED_FILE_TYPES: "image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/markdown"

  # Workspace limits
  WORKSPACE_MAX_MEMBERS: "1000"
  WORKSPACE_MAX_CHANNELS: "500"
  WORKSPACE_MAX_PROJECTS: "200"
  INVITE_EXPIRY_DAYS: "7"

  # Meeting
  MEETING_MAX_PARTICIPANTS: "250"
  RECORDING_RETENTION_DAYS: "90"

  # WebSocket
  SOCKET_IO_CORS_ORIGIN: "*"
  SOCKET_IO_PING_TIMEOUT: "60000"
  SOCKET_IO_PING_INTERVAL: "25000"

  # AI
  AI_MAX_ITERATIONS: "10"
  AI_CONTEXT_WINDOW_MESSAGES: "20"

  # Cache TTLs (seconds)
  CACHE_TTL_USER_PROFILE: "300"
  CACHE_TTL_WORKSPACE: "120"
  CACHE_TTL_PROJECT: "60"
