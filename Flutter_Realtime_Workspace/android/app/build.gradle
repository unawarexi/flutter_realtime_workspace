plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Release signing via key.properties (never committed) ──────────────────
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.teamspot.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias     = keystoreProperties['keyAlias']
                keyPassword  = keystoreProperties['keyPassword']
                storeFile    = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.teamspot.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Multidex for large dependency sets
        multiDexEnabled true
    }

    buildTypes {
        debug {
            debuggable true
        }
        profile {
            applicationIdSuffix ".profile"
            matchingFallbacks = ["debug"]
            debuggable false
        }
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
    }

    // Consistent APK naming
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "teamspot-${variant.name}-${variant.versionName}(${variant.versionCode}).apk"
        }
    }
}

flutter {
    source = "../.."
    
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}